<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arma Reforger — Pro-tipy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #1c2128;
  --border: #30363d; --border2: #444c56; --text: #e6edf3; --muted: #7d8590;
  --accent: #3fb950; --accent-dim: #1a3a20; --danger: #f85149; --danger-dim: #3d1a1a;
  --warn: #e3b341; --warn-dim: #3d2e0a; --radius: 6px;
  --font-mono: 'Share Tech Mono', monospace; --font-sans: 'Inter', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.6; min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
input, textarea, select {
  font-family: var(--font-sans); font-size: 13px; background: var(--surface2);
  color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 11px; width: 100%; transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,185,80,.12); }
textarea { resize: vertical; }
button { font-family: var(--font-sans); cursor: pointer; font-size: 13px; border-radius: var(--radius); border: none; transition: all 0.15s; }
.btn { padding: 8px 16px; font-weight: 500; }
.btn-primary { background: var(--accent); color: #0a0f0a; }
.btn-primary:hover { background: #4fd963; }
.btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--text); }
.btn-ghost:hover { background: var(--surface2); border-color: var(--text); }
.btn-danger { background: var(--danger-dim); color: var(--danger); border: 1px solid #5a1f1f; }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-sm { padding: 5px 11px; font-size: 12px; }
.btn-dashed { background: transparent; border: 1.5px dashed var(--border2); color: var(--muted); padding: 8px 16px; border-radius: var(--radius); transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
.btn-dashed:hover { border-color: var(--accent); color: var(--accent); background: rgba(63,185,80,.06); }

#header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(63,185,80,.08);
  padding: 0 24px; display: flex; align-items: center; gap: 20px;
  height: 54px; position: sticky; top: 0; z-index: 100;
}
#header h1 { font-family: var(--font-mono); font-size: 15px; color: var(--accent); letter-spacing: 0.06em; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
#header h1::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex-shrink: 0; }
#header h1 span { color: var(--muted); font-size: 13px; }
#nav { display: flex; gap: 4px; margin-left: auto; }
#nav button { background: transparent; color: var(--muted); padding: 6px 14px; border: 1px solid transparent; border-radius: 999px; font-size: 13px; font-weight: 500; }
#nav button:hover { color: var(--text); background: var(--surface2); border-color: var(--border); }
#nav button.active { color: var(--accent); border-color: var(--accent-dim); background: rgba(63,185,80,.08); }

#main-layout { display: flex; max-width: 1100px; margin: 0 auto; min-height: calc(100vh - 54px); }

#sidebar { width: 210px; min-width: 210px; border-right: 1px solid var(--border); padding: 20px 0; }
.sidebar-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; padding: 0 16px 10px; }
.cat-item { display: flex; align-items: center; gap: 9px; padding: 7px 16px; cursor: pointer; color: var(--muted); font-size: 13px; border-left: 2px solid transparent; transition: all 0.12s; }
.cat-item:hover { color: var(--text); background: rgba(255,255,255,.03); }
.cat-item.active { color: var(--text); background: rgba(255,255,255,.04); }
.cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; opacity: .6; transition: opacity 0.12s; }
.cat-item.active .cat-dot, .cat-item:hover .cat-dot { opacity: 1; }
.cat-item .cat-name { flex: 1; }
.cat-item .cnt { font-size: 11px; color: var(--muted); font-family: var(--font-mono); background: var(--surface2); padding: 1px 6px; border-radius: 999px; }

#content { flex: 1; padding: 22px 28px; min-width: 0; }

#toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: nowrap; }
.search-wrap { position: relative; flex: 1; max-width: 240px; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#search { padding-left: 34px; }
#toolbar .tip-count { font-size: 12px; color: var(--muted); margin-left: auto; font-family: var(--font-mono); white-space: nowrap; flex-shrink: 0; }

.tip-row { display: flex; gap: 14px; align-items: flex-start; padding: 11px 10px 11px 12px; margin: 0 -12px; border-bottom: 1px solid var(--border); border-radius: var(--radius); transition: background 0.12s; position: relative; }
.tip-row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; border-radius: 2px; background: transparent; transition: background 0.15s; }
.tip-row:hover { background: rgba(255,255,255,.025); }
.tip-row:hover::before { background: var(--tip-color, var(--accent)); }
.tip-row:last-child { border-bottom: none; }
.tip-num { font-family: var(--font-mono); font-size: 12px; color: var(--border2); min-width: 28px; padding-top: 1px; text-align: right; user-select: none; }
.tip-text { flex: 1; font-size: 14px; line-height: 1.65; }
.cat-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; font-weight: 500; }
.cat-badge::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

.empty { text-align: center; color: var(--muted); padding: 70px 20px; font-size: 13px; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

#modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(2px); z-index: 200; align-items: center; justify-content: center; }
#modal-bg.open { display: flex; }
#modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; width: min(540px, calc(100vw - 32px)); padding: 28px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
#modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
#modal .sub { font-size: 12px; color: var(--muted); margin-bottom: 22px; line-height: 1.5; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
.flash { font-size: 12px; padding: 9px 13px; border-radius: var(--radius); margin-top: 12px; }
.flash.ok { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(63,185,80,.3); }
.flash.err { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(248,81,73,.3); }

#admin-view { display: none; max-width: 1100px; margin: 0 auto; padding: 24px 28px; }
#admin-view.open { display: block; }
#login-box { max-width: 360px; margin: 80px auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
#login-box h2 { font-size: 16px; margin-bottom: 24px; font-family: var(--font-mono); color: var(--accent); }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.admin-header h2 { font-family: var(--font-mono); color: var(--accent); font-size: 15px; letter-spacing: .05em; }
.admin-header-actions { display: flex; gap: 8px; }

#admin-tabs { display: flex; gap: 6px; margin-bottom: 22px; background: var(--surface2); border-radius: 999px; padding: 4px; width: fit-content; }
#admin-tabs button { background: transparent; color: var(--muted); padding: 6px 18px; border: none; border-radius: 999px; font-size: 13px; font-weight: 500; transition: all 0.15s; }
#admin-tabs button:hover { color: var(--text); }
#admin-tabs button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.4); }

.proposal-card { background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--warn); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.proposal-card:hover { border-color: var(--border2); border-left-color: var(--warn); }
.proposal-card .meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.proposal-card .ptxt { font-size: 13px; line-height: 1.65; margin-bottom: 12px; }
.proposal-card .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--border); }

.section-title { font-size: 11px; font-weight: 600; margin-bottom: 14px; color: var(--muted); text-transform: uppercase; font-family: var(--font-mono); letter-spacing: .1em; display: flex; align-items: center; gap: 8px; }
.section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

.tip-edit-row { padding: 12px; margin: 4px 0; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); }
.tip-edit-row textarea { margin-bottom: 8px; }
.tip-edit-row .edit-actions { display: flex; gap: 6px; align-items: center; }
.tip-edit-row select { width: auto; font-size: 12px; padding: 5px 9px; }

.admin-cat-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.admin-cat-filter button { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 5px 13px; font-size: 12px; border-radius: 999px; transition: all 0.12s; }
.admin-cat-filter button:hover { color: var(--text); border-color: var(--border2); background: var(--surface); }
.admin-cat-filter button.active { color: var(--text); background: var(--surface); box-shadow: 0 0 0 1px var(--border2); }

.admin-tip-row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--border); }
.admin-tip-row:last-child { border-bottom: none; }
.admin-tip-row .tip-txt { flex: 1; font-size: 13px; line-height: 1.6; }

@media (max-width: 640px) {
  #sidebar { display: none; }
  #main-layout { flex-direction: column; }
  #header h1 span { display: none; }
  #content { padding: 16px; }
}
</style>
</head>
<body>

<div id="header">
  <h1>ARMA REFORGER <span>// pro-tipy</span></h1>
  <nav id="nav">
    <button class="active" onclick="showView('tips')">Tipy</button>
    <button onclick="showView('admin')" id="admin-nav-btn">Admin</button>
  </nav>
</div>

<div id="tips-view">
  <div id="main-layout">
    <div id="sidebar">
      <p class="sidebar-label">Kategorie</p>
      <div id="cat-list"></div>
    </div>
    <div id="content">
      <div id="toolbar">
        <input id="search" type="text" placeholder="Szukaj" oninput="applyFilters()">
        <span class="tip-count" id="tip-count"></span>
        <button class="btn btn-primary" style="white-space:nowrap;flex-shrink:0;" onclick="openModal()">+ Zgłoś tip</button>
      </div>
      <div id="tips-list"><div class="empty"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>

<div id="admin-view">
  <div id="login-box">
    <h2>// ADMIN</h2>
    <div class="field"><label>Email</label><input type="email" id="email-inp" placeholder="admin@email.com"></div>
    <div class="field"><label>Hasło</label><input type="password" id="pass-inp" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doLogin()">Zaloguj</button>
    <div id="login-err" class="flash err" style="display:none"></div>
  </div>
  <div id="admin-panel" style="display:none">
    <div class="admin-header">
      <h2>// PANEL ADMINA</h2>
      <div class="admin-header-actions">
        <button class="btn btn-ghost btn-sm" onclick="seedInitialTips()">Seed tipów</button>
        <button class="btn btn-ghost btn-sm" onclick="doLogout()">Wyloguj</button>
      </div>
    </div>
    <div id="admin-tabs">
      <button class="active" onclick="showAdminTab('proposals')">Propozycje <span id="pending-badge"></span></button>
      <button onclick="showAdminTab('all-tips')">Wszystkie tipy</button>
    </div>
    <div id="tab-proposals"></div>
    <div id="tab-all-tips" style="display:none"></div>
  </div>
</div>

<div id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <h2>Zgłoś propozycję tipu</h2>
    <p class="sub">Twoja propozycja trafi do admina do weryfikacji. Zaakceptowane tipy pojawią się na liście.</p>
    <div class="field"><label>Treść tipu *</label><textarea id="m-text" rows="3" placeholder="Opisz tipa..."></textarea></div>
    <div class="field"><label>Sugerowana kategoria</label>
      <select id="m-cat"><option value="">— wybierz —</option></select>
    </div>
    <div class="field"><label>Twój nick (opcjonalnie)</label><input type="text" id="m-nick" placeholder="np. Kowalski123"></div>
    <div id="modal-flash" style="display:none"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Anuluj</button>
      <button class="btn btn-primary" onclick="submitProposal()">Wyślij</button>
    </div>
  </div>
</div>

<script type="module">
// FB config

let allTips     = [];
let proposals   = [];
let selCat      = "all";
let currentUser = null;
let editingTipId  = null;
let adminSelCat   = "all";
let addingNewTip  = false;

window.showView = function(v) {
  document.getElementById("tips-view").style.display = v === "tips" ? "" : "none";
  document.getElementById("admin-view").classList.toggle("open", v === "admin");
  document.querySelectorAll("#nav button").forEach((b,i) => b.classList.toggle("active",(i===0&&v==="tips")||(i===1&&v==="admin")));
  if (v === "admin") renderAdmin();
};

function renderSidebar() {
  const counts = {};
  CATS.forEach(c => counts[c] = 0);
  allTips.forEach(t => { if (counts[t.cat] !== undefined) counts[t.cat]++; });
  let html = `<div class="cat-item ${selCat==='all'?'active':''}" onclick="setCat('all')" style="border-left-color:${selCat==='all'?'var(--accent)':'transparent'}">
    <span class="cat-dot" style="background:var(--muted)"></span>
    <span class="cat-name">Wszystkie</span>
    <span class="cnt">${allTips.length}</span>
  </div>`;
  CATS.forEach(c => {
    html += `<div class="cat-item ${selCat===c?'active':''}" onclick="setCat('${escQ(c)}')" style="border-left-color:${selCat===c?getColor(c):'transparent'}">
      <span class="cat-dot" style="background:${getColor(c)}"></span>
      <span class="cat-name">${c}</span>
      <span class="cnt">${counts[c]||0}</span>
    </div>`;
  });
  document.getElementById("cat-list").innerHTML = html;
  const mcat = document.getElementById("m-cat");
  if (mcat && mcat.options.length <= 1) {
    CATS.forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c; mcat.appendChild(o); });
  }
}

window.setCat = function(c) { selCat = c; renderSidebar(); applyFilters(); };
function getColor(c) { return CAT_COLORS[c] || "#8b949e"; }

async function loadTips() {
  try {
    const snap = await getDocs(query(collection(db,"tips"), orderBy("createdAt","asc")));
    allTips = snap.docs.map(d => ({id:d.id,...d.data()}));
  } catch(e) { allTips = []; }
  renderSidebar();
  applyFilters();
}

window.applyFilters = function() {
  const s = (document.getElementById("search")?.value || "").toLowerCase();
  const list = allTips.filter(t => {
    const mc = selCat === "all" || t.cat === selCat;
    const ms = !s || t.text.toLowerCase().includes(s);
    return mc && ms;
  });
  const n = list.length;
  const label = n === 1 ? "tip" : (n >= 2 && n <= 4) ? "tipy" : "tipów";
  document.getElementById("tip-count").textContent = n + " " + label;
  if (!list.length) { document.getElementById("tips-list").innerHTML = '<div class="empty">Brak tipów dla tych kryteriów.</div>'; return; }
  document.getElementById("tips-list").innerHTML = list.map((t,i) => `
    <div class="tip-row" style="--tip-color:${getColor(t.cat)}">
      <span class="tip-num">${String(i+1).padStart(2,"0")}</span>
      <span class="tip-text">${escH(t.text)}</span>
      ${selCat==="all"?`<span class="cat-badge" style="background:${getColor(t.cat)}18;color:${getColor(t.cat)};border:1px solid ${getColor(t.cat)}33">${t.cat}</span>`:""}
    </div>`).join("");
};

window.openModal  = function() { document.getElementById("modal-bg").classList.add("open"); document.getElementById("m-text").focus(); };
window.closeModal = function() {
  document.getElementById("modal-bg").classList.remove("open");
  document.getElementById("m-text").value = "";
  document.getElementById("m-nick").value = "";
  document.getElementById("m-cat").value = "";
  document.getElementById("modal-flash").style.display = "none";
};

window.submitProposal = async function() {
  const text  = document.getElementById("m-text").value.trim();
  const cat   = document.getElementById("m-cat").value;
  const nick  = document.getElementById("m-nick").value.trim();
  const flash = document.getElementById("modal-flash");
  if (!text) { showFlash(flash,"Wpisz treść tipu.","err"); return; }
  try {
    await addDoc(collection(db,"proposals"), { text, suggestedCat: cat||"", nick: nick||"anonim", status:"pending", submittedAt: serverTimestamp() });
    showFlash(flash,"Dzięki! Propozycja została wysłana do admina.","ok");
    setTimeout(closeModal, 2000);
  } catch(e) { showFlash(flash,"Błąd: "+e.message,"err"); }
};

window.doLogin = async function() {
  const email = document.getElementById("email-inp").value;
  const pass  = document.getElementById("pass-inp").value;
  const err   = document.getElementById("login-err");
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch(e) { err.textContent = "Błąd logowania: "+e.message; err.style.display="block"; }
};

window.doLogout = async function() { await signOut(auth); };

window.showAdminTab = function(t) {
  document.querySelectorAll("#admin-tabs button").forEach((b,i) => b.classList.toggle("active",(i===0&&t==="proposals")||(i===1&&t==="all-tips")));
  document.getElementById("tab-proposals").style.display  = t==="proposals" ? "" : "none";
  document.getElementById("tab-all-tips").style.display   = t==="all-tips"  ? "" : "none";
};

async function loadProposals() {
  const snap = await getDocs(query(collection(db,"proposals"), orderBy("submittedAt","desc")));
  proposals = snap.docs.map(d => ({id:d.id,...d.data()}));
}

async function renderAdmin() {
  const panel = document.getElementById("admin-panel");
  const login = document.getElementById("login-box");
  if (!currentUser) { panel.style.display="none"; login.style.display=""; return; }
  panel.style.display=""; login.style.display="none";
  await loadProposals();

  const pending = proposals.filter(p => p.status==="pending");
  document.getElementById("pending-badge").textContent = pending.length ? `(${pending.length})` : "";

  // propozycje, pewnie do reworka
  const pdiv = document.getElementById("tab-proposals");
  if (!pending.length) {
    pdiv.innerHTML = '<div class="empty" style="padding:40px 0">Brak nowych propozycji</div>';
  } else {
    pdiv.innerHTML = `<p class="section-title">${pending.length} oczekujących</p>` + pending.map(p => `
      <div class="proposal-card" id="pc-${p.id}">
        <div class="meta">od <strong>${escH(p.nick||"anonim")}</strong> &nbsp;|&nbsp; sugerowana kategoria: <strong>${escH(p.suggestedCat)||"—"}</strong></div>
        <div class="ptxt">${escH(p.text)}</div>
        <div class="actions">
          <select id="sel-${p.id}" style="width:auto;font-size:12px;padding:4px 8px;">
            ${CATS.map(c=>`<option value="${escH(c)}" ${c===(p.suggestedCat||CATS[0])?"selected":""}>${c}</option>`).join("")}
          </select>
          <button class="btn btn-sm btn-primary" onclick="approveProposal('${p.id}','${escQ(p.text)}')">Akceptuj</button>
          <button class="btn btn-sm btn-danger"  onclick="rejectProposal('${p.id}')">Odrzuć</button>
        </div>
      </div>`).join("");
  }

  // wszystkie tipy
  const adiv = document.getElementById("tab-all-tips");
  const visibleTips = adminSelCat === "all" ? allTips : allTips.filter(t => t.cat === adminSelCat);
  const filterBar = `<div class="admin-cat-filter">
    <button class="${adminSelCat==='all'?'active':''}" onclick="setAdminCat('all')">Wszystkie (${allTips.length})</button>
    ${CATS.map(c => { const n = allTips.filter(t=>t.cat===c).length; return n ? `<button class="${adminSelCat===c?'active':''}" onclick="setAdminCat('${escQ(c)}')" style="${adminSelCat===c?`border-color:${getColor(c)};color:${getColor(c)}`:''}">` + c + ` (${n})</button>` : ''; }).join("")}
  </div>`;
  const newTipForm = addingNewTip ? `
    <div class="tip-edit-row" style="margin-bottom:16px;">
      <textarea id="new-tip-text" rows="2" style="width:100%;margin-bottom:8px;" placeholder="Treść nowego tipu..."></textarea>
      <div class="edit-actions">
        <select id="new-tip-cat">
          ${CATS.map(c=>`<option value="${escH(c)}" ${c===(adminSelCat!=="all"?adminSelCat:CATS[0])?"selected":""}>${c}</option>`).join("")}
        </select>
        <button class="btn btn-sm btn-primary" onclick="addTipFromAdmin()">Dodaj</button>
        <button class="btn btn-sm btn-ghost" onclick="cancelNewTip()">Anuluj</button>
      </div>
    </div>` : `<button class="btn-dashed btn-sm" style="margin-bottom:16px;" onclick="openNewTip()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Dodaj tip
      </button>`;

  adiv.innerHTML = filterBar + newTipForm + `<p class="section-title">${visibleTips.length} tipów</p>` +
    visibleTips.map(t => editingTipId === t.id ? `
      <div class="tip-edit-row">
        <textarea id="edit-text-${t.id}" rows="2" style="width:100%">${escH(t.text)}</textarea>
        <div class="edit-actions">
          <select id="edit-cat-${t.id}">
            ${CATS.map(c=>`<option value="${escH(c)}" ${c===t.cat?"selected":""}>${c}</option>`).join("")}
          </select>
          <button class="btn btn-sm btn-primary" onclick="saveTip('${t.id}')">Zapisz</button>
          <button class="btn btn-sm btn-ghost"   onclick="cancelEditTip()">Anuluj</button>
        </div>
      </div>` : `
      <div class="admin-tip-row">
        <span class="tip-txt">${escH(t.text)}</span>
        <span class="cat-badge" style="background:${getColor(t.cat)}18;color:${getColor(t.cat)};border:1px solid ${getColor(t.cat)}33;flex-shrink:0">${t.cat}</span>
        <button class="btn btn-sm btn-ghost" style="flex-shrink:0" onclick="startEditTip('${t.id}')">Edytuj</button>
        <button class="btn btn-sm btn-danger" style="flex-shrink:0" onclick="deleteTip('${t.id}')">Usuń</button>
      </div>`).join("");
}

window.approveProposal = async function(id, text) {
  const cat = document.getElementById("sel-"+id)?.value || CATS[0];
  const batch = writeBatch(db);
  batch.update(doc(db,"proposals",id), {status:"approved"});
  batch.set(doc(collection(db,"tips")), {text, cat, createdAt: serverTimestamp()});
  await batch.commit();
  await loadTips();
  renderAdmin();
};

window.rejectProposal = async function(id) {
  await updateDoc(doc(db,"proposals",id), {status:"rejected"});
  renderAdmin();
};

window.deleteTip = async function(id) {
  if (!confirm("Usunąć ten tip?")) return;
  await deleteDoc(doc(db,"tips",id));
  editingTipId = null;
  await loadTips();
  renderAdmin();
};

window.startEditTip  = function(id) { editingTipId = id; addingNewTip = false; renderAdmin(); };
window.cancelEditTip = function() { editingTipId = null; renderAdmin(); };
window.setAdminCat   = function(c) { adminSelCat = c; editingTipId = null; renderAdmin(); };
window.openNewTip    = function() { addingNewTip = true; editingTipId = null; renderAdmin(); setTimeout(()=>document.getElementById("new-tip-text")?.focus(), 50); };
window.cancelNewTip  = function() { addingNewTip = false; renderAdmin(); };
window.addTipFromAdmin = async function() {
  const text = document.getElementById("new-tip-text")?.value.trim();
  const cat  = document.getElementById("new-tip-cat")?.value || CATS[0];
  if (!text) return;
  await addDoc(collection(db,"tips"), {text, cat, createdAt: serverTimestamp()});
  addingNewTip = false;
  await loadTips();
  renderAdmin();
};
window.saveTip = async function(id) {
  const text = document.getElementById("edit-text-"+id)?.value.trim();
  const cat  = document.getElementById("edit-cat-"+id)?.value;
  if (!text) return;
  await updateDoc(doc(db,"tips",id), {text, cat});
  editingTipId = null;
  await loadTips();
  renderAdmin();
};

window.seedInitialTips = async function() {
  const snap = await getDocs(collection(db,"tips"));
  if (snap.size > 0) { alert("Baza już zawiera tipy. Seed pominięty."); return; }
  if (!confirm(`Dodać ${INITIAL_TIPS.length} startowych tipów do bazy?`)) return;
  const batch = writeBatch(db);
  INITIAL_TIPS.forEach(t => batch.set(doc(collection(db,"tips")), {text:t.text, cat:t.cat, createdAt:serverTimestamp()}));
  await batch.commit();
  await loadTips();
  renderAdmin();
  alert("Gotowe!");
};

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (document.getElementById("admin-view").classList.contains("open")) renderAdmin();
});

function escH(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escQ(s) { return String(s||"").replace(/'/g,"\\'").replace(/"/g,"&quot;"); }
function showFlash(el,msg,type) { el.textContent=msg; el.className="flash "+type; el.style.display="block"; }

loadTips();
showView("tips");
</script>
</body>
</html>
